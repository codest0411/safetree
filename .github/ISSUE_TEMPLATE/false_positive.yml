name: False positive
description: Report a false positive finding from a safetree rule
labels: ["false-positive"]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: "e.g. ST004"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Tree entry / symlink target and why it is benign
    validations:
      required: true
