name: Bug report
description: Report a bug in safetree
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and include the command you ran.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions (safetree, Node.js, Git, OS)
      placeholder: "safetree 0.1.0, Node 24.x, Git 2.52, Windows 11"
    validations:
      required: true
