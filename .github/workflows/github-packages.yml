name: Publish GitHub Package

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Build if present
        run: node -e "const p=require('./package.json'); if(p.scripts?.build) require('child_process').execSync('npm run build',{stdio:'inherit'}); else if(p.scripts?.['build:types']) require('child_process').execSync('npm run build:types',{stdio:'inherit'});"
      - name: Scope package for GitHub Packages
        run: node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.name='@codest0411/'+p.name; p.publishConfig={registry:'https://npm.pkg.github.com'}; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');"
      - name: Publish to GitHub Packages
        env:
          GH_PKG_TOKEN: ${{ github.token }}
        run: |
          printf "//npm.pkg.github.com/:_authToken=%s\n" "$GH_PKG_TOKEN" >> ~/.npmrc
          npm publish --ignore-scripts